<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOR STY | Alternative Clothing & Accessories</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #8a0303;
            --accent-hover: #b30000;
            --text-color: #f0f0f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding-bottom: 90px;
        }

        header {
            background-color: #000;
            padding: 2.2rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(138, 3, 3, 0.3);
        }

        header h1 {
            font-size: 2.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.95rem;
            color: #888;
            margin-top: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Pestañas simples por categoría */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #333;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            font-weight: bold;
        }

        /* Catálogo de productos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
            transition: transform 0.25s, border-color 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        /* Encuadre completo sin recortar la foto */
        .img-wrapper {
            width: 100%;
            height: 260px;
            background-color: #090909;
            border-bottom: 1px solid #333;
            position: relative;
            cursor: zoom-in;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.25s;
        }

        .img-wrapper:hover img {
            transform: scale(1.03);
        }

        .zoom-hint {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #ccc;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
        }

        .card-body {
            padding: 15px;
            text-align: center;
        }

        .card-body h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-body .desc {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 3px;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-add:hover { background-color: var(--accent-hover); }
        .btn-add.added { background-color: #1f7a4c; }
        .btn-add:disabled { background-color: #333; color: #777; cursor: not-allowed; }

        /* Botón Flotante del Carrito */
        .carrito-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: 2px solid var(--accent-color);
            padding: 14px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 100;
            transition: transform 0.2s;
        }

        .carrito-btn.bump { transform: scale(1.12); }

        /* Ventanas emergentes (Carrito y Zoom de imagen) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 5px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .cerrar {
            cursor: pointer;
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--accent-color);
        }

        /* Item del carrito con foto miniatura */
        .carrito-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #2a2a2a;
            padding: 10px 0;
            font-size: 0.88rem;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-thumb {
            width: 48px;
            height: 48px;
            object-fit: contain;
            background: #090909;
            border: 1px solid #333;
            border-radius: 3px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-controls button {
            background: #333;
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 3px;
        }

        .total-box {
            text-align: right;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 15px 0;
            color: #fff;
        }

        /* Cuadro de Yape */
        .yape-box {
            background-color: #121212;
            border: 1px solid #333;
            padding: 14px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .qr-img {
            width: 190px;
            height: 190px;
            object-fit: contain;
            background: #fff;
            padding: 6px;
            border-radius: 5px;
            margin: 10px auto;
            display: block;
            cursor: zoom-in;
        }

        .btn-copy {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 7px 12px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 4px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #121212;
            color: white;
            border: 1px solid #444;
            font-family: inherit;
            border-radius: 3px;
        }

        .btn-whatsapp {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-whatsapp:hover { background-color: var(--accent-hover); }

        /* Visor Lightbox */
        #lightboxModal { z-index: 300; flex-direction: column; }
        #lightboxImg {
            max-width: 92%;
            max-height: 80vh;
            object-fit: contain;
            border: 2px solid var(--accent-color);
            background-color: #000;
            border-radius: 4px;
        }
        #lightboxCaption {
            margin-top: 10px;
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #333;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>NOR STY</h1>
        <p>Alternative Clothing, Accessories & Makeup</p>
    </header>

    <div class="container">
        <!-- Filtros simples -->
        <div class="filters">
            <button class="filter-btn active" onclick="cambiarCategoria('Todos', this)">Todos</button>
            <button class="filter-btn" onclick="cambiarCategoria('Ropa', this)">Ropa</button>
            <button class="filter-btn" onclick="cambiarCategoria('Accesorios', this)">Accesorios</button>
            <button class="filter-btn" onclick="cambiarCategoria('Maquillaje', this)">Maquillaje</button>
        </div>

        <!-- Productos -->
        <div class="grid" id="productos-contenedor"></div>
    </div>

    <!-- Botón del Carrito -->
    <button class="carrito-btn" id="btnCarritoFlotante" onclick="abrirCarrito()">
        🛒 Ver Carrito (<span id="contador">0</span>) - S/ <span id="boton-total">0.00</span>
    </button>

    <!-- Visor de fotos en grande -->
    <div class="modal-overlay" id="lightboxModal" onclick="cerrarLightbox()">
        <span class="cerrar" style="position:fixed; top:20px; right:30px; font-size:2.2rem; color:#fff;">✕</span>
        <img id="lightboxImg" src="" alt="Detalle">
        <p id="lightboxCaption"></p>
    </div>

    <!-- Ventana del Carrito + Yape -->
    <div class="modal-overlay" id="overlayCarrito">
        <div class="modal-box">
            <div class="modal-header">
                <h2>TU COMPRA</h2>
                <span class="cerrar" onclick="cerrarCarrito()">✕</span>
            </div>

            <div id="lista-carrito"></div>

            <div class="total-box">
                Total: S/ <span id="total-precio">0.00</span>
            </div>

            <div class="yape-box">
                <p style="font-size: 0.82rem; color: #ccc;">Escanea el QR (tócalo para agrandar) o copia el número para Yapear:</p>
                <img src="qr-yape.jpg" alt="QR Yape" class="qr-img" onclick="abrirLightbox(this.src, 'QR Yape - NOR STY')" onerror="this.src='https://via.placeholder.com/200x200/ffffff/8a0303?text=QR+YAPE'">
                <button class="btn-copy" onclick="copiarYape('920572776')">📋 Copiar número Yape: 920 572 776</button>
            </div>

            <input type="text" id="nombreCliente" class="form-input" placeholder="Tu Nombre">
            
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                Confirmar pedido por WhatsApp
            </button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 NOR STY</p>
    </footer>

    <script>
        // Número oficial configurado para WhatsApp
        const TELEFONO_WHATSAPP = "51920572776";

        // LISTA DE PRODUCTOS: Para añadir más, copia y pega un bloque { ... }
        const productos = [
            {
                id: 1,
                nombre: "Corset Nocturno",
                categoria: "Ropa",
                precio: 65.00,
                imagen: "ropa1.jpg",
                descripcion: "Diseño ajustable con broches metálicos y encaje fino.",
                agotado: false
            },
            {
                id: 2,
                nombre: "Choker de Púas Clásico",
                categoria: "Accesorios",
                precio: 25.00,
                imagen: "accesorio1.jpg",
                descripcion: "Cuero sintético con herrajes de acero inoxidable.",
                agotado: false
            },
            {
                id: 3,
                nombre: "Labial 'Sangre Fría'",
                categoria: "Maquillaje",
                precio: 35.00,
                imagen: "maquillaje1.jpg",
                descripcion: "Tono rojo borgoña profundo, acabado mate.",
                agotado: false
            }
        ];

        let categoriaActual = 'Todos';
        let carrito = JSON.parse(localStorage.getItem('carritoNorStySimple')) || [];

        function mostrarProductos() {
            const contenedor = document.getElementById('productos-contenedor');
            contenedor.innerHTML = '';

            const filtrados = categoriaActual === 'Todos'
                ? productos
                : productos.filter(p => p.categoria === categoriaActual);

            filtrados.forEach(p => {
                const fallback = 'https://via.placeholder.com/300x300/1e1e1e/ffffff?text=NOR+STY';
                const botonHTML = p.agotado
                    ? `<button class="btn-add" disabled>Agotado</button>`
                    : `<button class="btn-add" id="btn-${p.id}" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-wrapper" onclick="abrirLightbox('${p.imagen}', '${p.nombre}')">
                        <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='${fallback}'">
                        <span class="zoom-hint">🔍 Ver foto</span>
                    </div>
                    <div class="card-body">
                        <h3>${p.nombre}</h3>
                        <p class="desc">${p.descripcion}</p>
                        <p class="price">S/ ${p.precio.toFixed(2)}</p>
                        ${botonHTML}
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function cambiarCategoria(categoria, btn) {
            categoriaActual = categoria;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            mostrarProductos();
        }

        function agregarAlCarrito(id) {
            const prod = productos.find(p => p.id === id);
            const existente = carrito.find(item => item.id === id);

            if (existente) {
                existente.cantidad += 1;
            } else {
                carrito.push({
                    id: prod.id,
                    nombre: prod.nombre,
                    precio: prod.precio,
                    imagen: prod.imagen,
                    cantidad: 1
                });
            }

            // Efecto interactivo en el botón
            const btn = document.getElementById(`btn-${id}`);
            if (btn) {
                btn.innerText = "¡Agregado! ✓";
                btn.classList.add("added");
                setTimeout(() => {
                    btn.innerText = "Agregar al Carrito";
                    btn.classList.remove("added");
                }, 900);
            }

            const btnFlotante = document.getElementById('btnCarritoFlotante');
            btnFlotante.classList.add('bump');
            setTimeout(() => btnFlotante.classList.remove('bump'), 250);

            actualizarCarrito();
        }

        function cambiarCantidad(index, delta) {
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) {
                carrito.splice(index, 1);
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            localStorage.setItem('carritoNorStySimple', JSON.stringify(carrito));
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = '';

            let total = 0;
            let totalItems = 0;

            if (carrito.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#888; padding: 15px 0;">Aún no has agregado productos.</p>';
            }

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                totalItems += item.cantidad;

                lista.innerHTML += `
                    <div class="carrito-item">
                        <div class="item-info">
                            <img src="${item.imagen}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50x50/1e1e1e/fff?text=NOR'">
                            <div>
                                <strong>${item.nombre}</strong><br>
                                <span style="color:#aaa;">S/ ${ subtotal.toFixed(2) }</span>
                            </div>
                        </div>
                        <div class="qty-controls">
                            <button onclick="cambiarCantidad(${index}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('contador').innerText = totalItems;
            document.getElementById('boton-total').innerText = total.toFixed(2);
            document.getElementById('total-precio').innerText = total.toFixed(2);
        }

        function abrirLightbox(src, titulo) {
            const img = document.getElementById('lightboxImg');
            img.src = src;
            img.onerror = function() {
                this.src = 'https://via.placeholder.com/500x500/1e1e1e/ffffff?text=Foto+Pendiente';
            };
            document.getElementById('lightboxCaption').innerText = titulo;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function cerrarLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function abrirCarrito() {
            document.getElementById('overlayCarrito').style.display = 'flex';
        }

        function cerrarCarrito() {
            document.getElementById('overlayCarrito').style.display = 'none';
        }

        function copiarYape(numero) {
            navigator.clipboard.writeText(numero);
            alert("Número de Yape copiado: " + numero);
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            const nombre = document.getElementById('nombreCliente').value.trim();
            if (!nombre) {
                alert("Por favor ingresa tu nombre.");
                return;
            }

            let total = 0;
            const detalle = carrito.map(item => {
                const sub = item.precio * item.cantidad;
                total += sub;
                return `- ${item.cantidad}x ${item.nombre} (S/ ${sub.toFixed(2)})`;
            }).join('%0A');

            const mensaje = `Hola *NOR STY*, soy *${nombre}*.%0A%0AMi pedido es:%0A${detalle}%0A%0A*Total Yapeado: S/ ${total.toFixed(2)}*%0ATe envío la captura de mi pago para coordinar la entrega.`;

            window.open(`https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`, '_blank');
        }

        mostrarProductos();
        actualizarCarrito();
    </script>
</body>
</html>
